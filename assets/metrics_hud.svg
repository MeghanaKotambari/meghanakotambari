    <line x1="12" y1="2" x2="164" y2="2" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <path d="M6 16 L6 8 L14 8" stroke="#22D3EE" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M170 68 L170 76 L162 76" stroke="#22D3EE" stroke-width="1.2" fill="none" opacity="0.6" />
    <circle cx="162" cy="16" r="3" fill="#22D3EE" filter="url(#hud-glow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.0s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="44" fill="#22D3EE" font-size="21" font-weight="900" letter-spacing="0.5">1.5+ YRS</text>
    <text x="14" y="66" fill="#94A3B8" font-size="11" font-weight="500">4 Internships Completed</text>
  </g>
