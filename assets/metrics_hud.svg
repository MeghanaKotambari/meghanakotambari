<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 98" width="100%" height="98" style="background-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace;">
  <defs>
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="blur" /><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .hud-card { cursor: pointer; transition: transform 0.25s ease, filter 0.25s ease; }
      .hud-card:hover { transform: translateY(-4px); filter: drop-shadow(0 6px 14px rgba(34, 211, 238, 0.4)); }
      .hud-card:hover rect.card-body { stroke: #22D3EE !important; fill: #0c182c !important; }
    </style>
  </defs>
  <!-- Metric Card 1 -->
  <g class="hud-card" transform="translate(10, 6)">
