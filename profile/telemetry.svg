<svg xmlns="http://www.w3.org/2000/svg" width="876" height="290" viewBox="0 0 876 290" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Meghana Kotambari GitHub Telemetry</title>
  <desc id="desc">Dark telemetry card with GitHub stats and top languages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="876" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D14" />
      <stop offset="1" stop-color="#0C1018" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020" />
      <stop offset="1" stop-color="#10162A" />
    </linearGradient>
    <linearGradient id="bar-js" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F5DE53" />
      <stop offset="1" stop-color="#F5DE53" />
    </linearGradient>
    <linearGradient id="bar-py" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3C78B4" />
      <stop offset="1" stop-color="#3C78B4" />
    </linearGradient>
    <linearGradient id="bar-css" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7A3DB8" />
      <stop offset="1" stop-color="#7A3DB8" />
    </linearGradient>
    <linearGradient id="bar-html" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#EB5A2B" />
      <stop offset="1" stop-color="#EB5A2B" />
    </linearGradient>
    <linearGradient id="bar-php" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5E6AA8" />
      <stop offset="1" stop-color="#5E6AA8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <rect width="876" height="290" rx="2" fill="url(#bg)" />
  <rect x="4" y="14" width="868" height="262" rx="4" fill="#0B0F18" stroke="#39424E" stroke-width="1.2" />

  <g transform="translate(25 30)">
    <rect x="0" y="0" width="398" height="216" rx="3" fill="url(#panel)" stroke="#273246" stroke-width="1.2" />
    <path d="M10 11h10M10 11v10" stroke="#22D3EE" stroke-width="1.2" stroke-linecap="round" />
    <path d="M388 205h-10M388 205v-10" stroke="#22D3EE" stroke-width="1.2" stroke-linecap="round" />
    <text x="26" y="33" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">⚡ GitHub Telemetry</text>
    <line x1="18" y1="46" x2="380" y2="46" stroke="#273246" stroke-width="1" />

    <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#DCE2EA">
      <g transform="translate(23 68)">
        <circle cx="8" cy="8" r="5.5" fill="#22D3EE" opacity="0.9" />
        <text x="28" y="12">Total Contributions:</text>
        <text x="186" y="12" fill="#F8FAFC">1,585+</text>
      </g>
      <g transform="translate(23 92)">
        <circle cx="8" cy="8" r="5.5" fill="#10B981" opacity="0.95" />
        <text x="28" y="12">Active Streak:</text>
        <text x="176" y="12" fill="#F8FAFC">72 Days</text>
        <text x="228" y="12">🔥</text>
      </g>
      <g transform="translate(23 116)">
        <circle cx="8" cy="8" r="5.5" fill="#F59E0B" opacity="0.95" />
        <text x="28" y="12">Public Repositories:</text>
        <text x="186" y="12" fill="#F8FAFC">40 Repos</text>
      </g>
      <g transform="translate(23 140)">
        <circle cx="8" cy="8" r="5.5" fill="#A78BFA" opacity="0.95" />
        <text x="28" y="12">Repository Forks:</text>
        <text x="186" y="12" fill="#F8FAFC">2 Forks</text>
      </g>
      <g transform="translate(23 164)">
        <circle cx="8" cy="8" r="5.5" fill="#8B5CF6" opacity="0.95" />
        <text x="28" y="12">System Runtime:</text>
        <text x="186" y="12" fill="#F8FAFC">100% Optimal</text>
      </g>
    </g>
  </g>

  <g transform="translate(430 30)">
    <rect x="0" y="0" width="420" height="216" rx="3" fill="url(#panel)" stroke="#273246" stroke-width="1.2" />
    <path d="M10 11h10M10 11v10" stroke="#22D3EE" stroke-width="1.2" stroke-linecap="round" />
    <path d="M410 205h-10M410 205v-10" stroke="#22D3EE" stroke-width="1.2" stroke-linecap="round" />
    <text x="22" y="33" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">🛠 Most Used Languages</text>
    <line x1="16" y1="46" x2="404" y2="46" stroke="#273246" stroke-width="1" />

    <g transform="translate(16 60)">
      <rect x="0" y="0" width="388" height="11" rx="5.5" fill="#1B2437" />
      <rect x="0" y="0" width="255" height="11" rx="5.5" fill="url(#bar-js)" />
      <rect x="255" y="0" width="59" height="11" fill="url(#bar-py)" />
      <rect x="314" y="0" width="33" height="11" fill="url(#bar-css)" />
      <rect x="347" y="0" width="16" height="11" fill="url(#bar-html)" />
      <rect x="363" y="0" width="25" height="11" rx="0 5.5 5.5 0" fill="url(#bar-php)" />
    </g>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#DCE2EA">
      <g transform="translate(18 98)">
        <circle cx="5" cy="5" r="5" fill="#F5DE53" />
        <text x="18" y="9">JavaScript 65.7%</text>
      </g>
      <g transform="translate(18 128)">
        <circle cx="5" cy="5" r="5" fill="#3C78B4" />
        <text x="18" y="9">TypeScript 14.8%</text>
      </g>
      <g transform="translate(18 158)">
        <circle cx="5" cy="5" r="5" fill="#7A3DB8" />
        <text x="18" y="9">CSS / Styling 8.6%</text>
      </g>
      <g transform="translate(238 98)">
        <circle cx="5" cy="5" r="5" fill="#EB5A2B" />
        <text x="18" y="9">Python 4.4%</text>
      </g>
      <g transform="translate(238 128)">
        <circle cx="5" cy="5" r="5" fill="#5E6AA8" />
        <text x="18" y="9">HTML 4.2%</text>
      </g>
      <g transform="translate(238 158)">
        <circle cx="5" cy="5" r="5" fill="#C084FC" />
        <text x="18" y="9">Solidity / Others 2.3%</text>
      </g>
    </g>
  </g>
</svg>
