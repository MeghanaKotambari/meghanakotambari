<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Meghana's GitHub Stats</title>
  <desc id="desc">Placeholder stats card that will be refreshed by GitHub Actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="495" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A101F" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="40" y1="28" x2="455" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.133 0 0 0 0 0.827 0 0 0 0 0.933 0 0 0 0.35 0" />
    </filter>
  </defs>
  <rect width="495" height="195" rx="18" fill="url(#bg)" />
  <rect x="22" y="20" width="451" height="155" rx="14" fill="#0F172A" stroke="rgba(255,255,255,0.08)" />
  <circle cx="76" cy="72" r="28" fill="url(#accent)" filter="url(#glow)" />
  <path d="M65 72h22M76 61v22" stroke="#0A101F" stroke-width="5" stroke-linecap="round" />
  <text x="120" y="66" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Meghana's GitHub Stats</text>
  <text x="120" y="94" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Live stats card will populate after the workflow runs.</text>
  <g fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
    <text x="120" y="128">Repositories</text>
    <text x="120" y="150">Commits</text>
    <text x="276" y="128">Stars</text>
    <text x="276" y="150">Contributions</text>
  </g>
  <g stroke-linecap="round">
    <path d="M120 158h110" stroke="rgba(148,163,184,0.25)" stroke-width="6" />
    <path d="M276 158h110" stroke="rgba(148,163,184,0.25)" stroke-width="6" />
  </g>
  <text x="367" y="150" text-anchor="end" fill="#22D3EE" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">pending</text>
</svg>
